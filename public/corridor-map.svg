<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" fill="none">
  <!-- Carte stylisée du corridor Douala → N'Djamena — fond très clair, flat géométrique -->
  <defs>
    <style>
      .city { fill: #17334C; }
      .city-ring { fill: none; stroke: #E8930C; stroke-width: 2; }
      .label { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; fill: #0F2437; }
      .label-sub { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; fill: #9AA3AD; }
      .num { font-family: 'Sora', sans-serif; font-size: 11px; font-weight: 700; fill: #FFFFFF; }
      .sea { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; fill: #7C93AB; font-style: italic; }
      @keyframes dashflow { to { stroke-dashoffset: -24; } }
      .route { stroke: #E8930C; stroke-width: 3; stroke-dasharray: 2 10; stroke-linecap: round; animation: dashflow 1.6s linear infinite; }
      .searoute { stroke: #0EA5E9; stroke-width: 2.5; stroke-dasharray: 1 9; stroke-linecap: round; animation: dashflow 2.4s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .route, .searoute { animation: none; } }
    </style>
  </defs>

  <!-- Fond -->
  <rect width="800" height="480" rx="12" fill="#EEF0F3"/>

  <!-- Mer (golfe de Guinée) à gauche -->
  <path d="M0 0 H210 C 170 90, 150 170, 165 240 C 178 300, 150 380, 120 480 H0 Z" fill="#DCE7F0"/>
  <path d="M0 60 C 60 75, 105 85, 158 92" stroke="#C3D4E4" stroke-width="2" stroke-linecap="round"/>
  <path d="M0 150 C 55 160, 95 168, 150 172" stroke="#C3D4E4" stroke-width="2" stroke-linecap="round"/>
  <path d="M0 330 C 50 335, 85 340, 138 352" stroke="#C3D4E4" stroke-width="2" stroke-linecap="round"/>
  <text x="34" y="255" class="sea">Golfe de Guinée</text>

  <!-- Relief Sahel (formes abstraites sable à droite) -->
  <path d="M640 60 q 40 -18 84 -4 q -28 26 -84 4 Z" fill="#FDF1DC"/>
  <path d="M560 400 q 52 -22 104 -2 q -36 30 -104 2 Z" fill="#FDF1DC"/>
  <path d="M300 80 q 30 -14 62 -3 q -22 20 -62 3 Z" fill="#FDF1DC" opacity="0.7"/>
  <g stroke="#E3D9C4" stroke-width="1.5" stroke-linecap="round">
    <path d="M620 150 h36 M638 138 v24"/>
    <path d="M700 320 h30 M715 309 v22"/>
    <path d="M480 200 h28 M494 190 v20"/>
  </g>

  <!-- Tracé maritime (vers Douala, en mer) -->
  <path d="M52 380 C 90 360, 130 330, 175 300" class="searoute" fill="none"/>

  <!-- Tracé terrestre du corridor : Douala → Ngaoundéré → Kousséri → Nguéli → N'Djamena -->
  <path d="M195 288 C 260 250, 330 235, 398 222 C 470 208, 540 185, 590 160 C 615 148, 628 140, 648 132 C 668 124, 690 118, 712 110" class="route" fill="none"/>

  <!-- Villes-étapes (pins numérotés) -->
  <!-- 1 · Douala -->
  <circle cx="195" cy="288" r="14" class="city"/>
  <circle cx="195" cy="288" r="18" class="city-ring"/>
  <text x="195" y="292.5" text-anchor="middle" class="num">1</text>
  <text x="195" y="322" text-anchor="middle" class="label">Douala</text>
  <text x="195" y="338" text-anchor="middle" class="label-sub">Port d'embarquement</text>

  <!-- 2 · Ngaoundéré -->
  <circle cx="398" cy="222" r="14" class="city"/>
  <circle cx="398" cy="222" r="18" class="city-ring"/>
  <text x="398" y="226.5" text-anchor="middle" class="num">2</text>
  <text x="398" y="252" text-anchor="middle" class="label">Ngaoundéré</text>
  <text x="398" y="268" text-anchor="middle" class="label-sub">Transit terrestre</text>

  <!-- 3 · Kousséri -->
  <circle cx="590" cy="160" r="14" class="city"/>
  <circle cx="590" cy="160" r="18" class="city-ring"/>
  <text x="590" y="164.5" text-anchor="middle" class="num">3</text>
  <text x="590" y="140" text-anchor="middle" class="label">Kousséri</text>

  <!-- 4 · Nguéli -->
  <circle cx="648" cy="132" r="14" class="city"/>
  <circle cx="648" cy="132" r="18" class="city-ring"/>
  <text x="648" y="136.5" text-anchor="middle" class="num">4</text>
  <text x="648" y="108" text-anchor="middle" class="label">Nguéli</text>
  <text x="648" y="92" text-anchor="middle" class="label-sub">Frontière</text>

  <!-- 5 · N'Djamena -->
  <circle cx="712" cy="110" r="14" class="city"/>
  <circle cx="712" cy="110" r="18" class="city-ring"/>
  <text x="712" y="114.5" text-anchor="middle" class="num">5</text>
  <text x="712" y="86" text-anchor="middle" class="label">N'Djamena</text>
  <text x="712" y="70" text-anchor="middle" class="label-sub">Entrepôt final</text>

  <!-- Légende -->
  <g>
    <rect x="24" y="418" width="232" height="40" rx="8" fill="#FFFFFF" opacity="0.85"/>
    <path d="M40 438 h28" class="route"/>
    <text x="76" y="442" class="label-sub">Corridor routier (~1 700 km)</text>
    <path d="M40 438 h0" />
    <path d="M180 438 h24" class="searoute"/>
    <text x="210" y="442" class="label-sub">Mer</text>
  </g>
</svg>
